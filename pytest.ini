[pytest]
# Two top-level `app` names live in this tree: `app.py` (the runner's GreenDream App) and
# `language/app/` (the service's FastAPI package). `pythonpath = .` pins this repo root ahead
# of everything on sys.path, so `import app` here is always `app.py` no matter how pytest was
# invoked. `language/` has the mirror of this file pinning its own root.
pythonpath = .
testpaths = tests

# `language/` is a pytest project of its own (its own rootdir, its own pytest.ini) and is never
# collected from here. Not a convenience: its `tests/conftest.py` rewrites os.environ at import
# time to point the service at a scratch data dir, which has no business running in this suite.
# Run it with `cd language; python -m pytest`.
norecursedirs = language .git .venv __pycache__ demo journal models web common/web
