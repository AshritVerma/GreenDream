[pytest]
# `pythonpath = .` is resolved against this rootdir, so `language/` goes on sys.path ahead of
# the repo root and `import app` is this service's package rather than GreenDream's top-level
# `app.py`. Both names exist in one tree now; neither suite should depend on the cwd to tell
# them apart. `test_alignment.py` appends the repo root rather than prepending it, for the
# same reason.
pythonpath = .
testpaths = tests
addopts = -q
